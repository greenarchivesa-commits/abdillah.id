<!DOCTYPE html>
<html lang="id">
<head>

<style>
/* Cara Mematikan Highlighting (Selection) Global, Kecuali Isi Artikel
Biar pas orang buka pake HP gak sengaja nge-highlight teks tampilan menu/tombol yang malah bikin risih, kita bisa matikan fitur text selection lewat CSS secara global, tapi kita hidupkan khusus untuk area teks artikel (.article-body).

Tambahkan kode CSS ini di bagian paling atas atau bawah file style.css:

CSS */

/* Matikan seleksi teks untuk SELURUH HALAMAN secara default */
* {
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none;    /* IE 10+ */
    user-select: none;        /* Standard */
}

/* KECUALI bagian isi artikel, tetap bisa di-highlight / di-copy */
.article-body, 
.article-body * {
    -webkit-user-select: text;
    -ms-user-select: text;
    user-select: text;
}


/* STYLING TAG YANG TOMBOLNYA DI SEKITAR CEARCH BAR  */
.category-filters {
    display: flex;
    gap: 8px;
    justify-content: flex-start /*center*/;
    margin: 15px 0 25px 0;
    flex-wrap: wrap;
}

.chip {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.chip:hover, .chip.active {
    background: var(--text-color);
    color: var(--bg-color);
    border-color: var(--text-color);
}

/* BIAR TAGS NNYA BISA DI GESER KALAU HP */

/* Sembunyikan scrollbar bawaan biar tetap kelihatan minimalis */

.category-filters {
    display: flex;
    flex-wrap: nowrap;         /* KUNCI UTAMA: Larang keras pindah ke baris bawah */
    gap: 8px;
    margin: 15px 0 25px 0;
    overflow-x: auto;          /* Bikin bisa digeser ke samping */
    white-space: nowrap;       /* Pastikan teks chip tidak turun baris */
    padding-bottom: 6px;       
    -webkit-overflow-scrolling: touch; 
}

/* Sembunyikan scrollbar bawaan */
.category-filters::-webkit-scrollbar {
    display: none;             
}
.category-filters {
    scrollbar-width: none;     
}

.chip {
    flex-shrink: 0;            /* Cegah chip ikut gepeng di HP */
}


</style>

<body>

<!-- DROPDOWN REKOMENDASI SAAT SEARCH DI-FOCUS -->
                <div id="searchDropdown" class="search-dropdown" style="z-index: 999999;">
                    <div class="dropdown-header">Hot Topics:</div>
		    <div id="dynamicHotList"></div>
                    <div class="dropdown-item" data-query="Menahan Syahwat">↪ Menahan Syahwat</div>
                    <div class="dropdown-item" data-query="Cara Menjadi Ahlul Quran">↪ Cara Menjadi Ahlul Quran</div>
                    <div class="dropdown-item" data-query="Ikhtilaf">↪ Ikhtilaf tanaawwu' dan tadhaad</div>
                    <hr class="dropdown-divider">
                    <div class="dropdown-item command" data-query="@all"><strong>@all</strong> untuk menampilkan semua artikel</div>
                    <div class="dropdown-item command" data-query="@new"><strong>@new</strong> untuk menampilkan artikel pekan ini</div>
                    <div class="dropdown-item command" data-query="@hot"><strong>@hot</strong> untuk menampilkan artikel yg urgen</div>
                </div>



    <div class="wrapper" id="mainWrapper">
        <!-- Header / Logo -->
        <div class="header-area">
            <a href="index.html" class="logo">abdillah.com</a>
        </div>

        <!-- Search Container -->
        <div class="search-container">
            <div class="search-wrapper">
                <input type="text" id="searchBox" class="search-box" placeholder="Cari artikel...">
                <button class="search-btn" id="searchBtn">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </button>



<!---->                

            </div>

<!-- Kategori Filter Chips -->
<div class="category-filters" id="categoryFilters">
    <button class="chip active" data-cat="all">Semua</button>
    <button class="chip" data-cat="Coding">Coding</button>
    <button class="chip" data-cat="Teknologi">Teknologi</button>
    <button class="chip" data-cat="Refleksi">Refleksi</button>
    <button class="chip" data-cat="Catatan">Catatan</button>
    <button class="chip" data-cat="Fikih">Fikih</button>
</div> <br>

            <!-- Teks Explore di Bawah Search Bar -->
            <div class="explore-hint" style="font-size: 14px; margin-top: 10px; text-align: center;">
                atau kamu juga bisa <span id="exploreBtn">explore</span>
            </div>
        </div>



        <!-- Area Hasil Artikel -->
        <div class="content-area" id="contentArea">
            <div class="results-list" id="resultsList"></div>
            <div id="infoText" class="info-text" style="display: none;">Artikel tidak ditemukan...</div>
        </div>
    </div>

    <!-- Floating Bubble Menu -->
    <div class="floating-container">
        <div id="floatMenu" class="float-menu">
            <button id="btnBackToTop">⬆️ Naik ke Atas</button>
            <button id="btnSwitchTheme">🌓 Ganti Tema</button>
        </div>
      <!--  <button id="floatBubble" class="float-btn" title="Menu">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>  -->

<button id="floatBubble" class="float-btn" title="Menu">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
</button>

    </div>

    <script src="script.js"></script>
    <script>
        const searchBox = document.getElementById('searchBox');
        const searchDropdown = document.getElementById('searchDropdown');
        const exploreBtn = document.getElementById('exploreBtn');
        const resultsList = document.getElementById('resultsList');
        const infoText = document.getElementById('infoText');
        const wrapper = document.getElementById('mainWrapper');

        // Render awal kosong / tampilkan beberapa artikel santai
        function renderArticles(data) {
            resultsList.innerHTML = '';
            if (data.length === 0) {
                infoText.style.display = 'block';
                return;
            }
            infoText.style.display = 'none';
            
            data.forEach(item => {
                const card = document.createElement('a');
                card.href = item.url;
                card.className = 'result-item';
                card.innerHTML = `
                    ${item.image ? `<img src="${item.image}" class="result-img" alt="Thumbnail">` : ''}
                    <div class="result-content">
                        <div class="result-meta">
                            <span class="badge">${item.badge || 'tulisan'}</span>
                            <span>${item.date}</span>
                        </div>
                        <div class="result-title">${item.title}</div>
                        <div class="result-caption">${item.caption}</div>
                    </div>
                `;
                resultsList.appendChild(card);
            });
        }

        // Logika Filter Pintar (Support @all, @new, @hot, & Keyword)
        function handleSearch(query) {
            const q = query.trim().toLowerCase();
            if (q === '') {
                wrapper.classList.remove('searched');
                resultsList.innerHTML = '';
                return;
            }

            wrapper.classList.add('searched');
            searchDropdown.classList.remove('active');

            let filtered = [];
            if (q === '@all') {
                filtered = articles; // Munculkan semua buat doom scrolling
            } else if (q === '@new') {
                filtered = articles.filter(item => item.badge === 'baru' || item.badge === 'hot');
            } else if (q === '@hot') {
                filtered = articles.filter(item => item.badge === 'hot' || item.badge === 'up');
            } else {
                filtered = articles.filter(item => 
                    item.title.toLowerCase().includes(q) || 
                    item.caption.toLowerCase().includes(q)
                );
            }
            renderArticles(filtered);
        }

        // Event Input Search Bar
        searchBox.addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        // Tampilkan Dropdown saat Search Bar diklik / focus
        searchBox.addEventListener('focus', () => {
            searchDropdown.classList.add('active');
        });

        // Klik tombol Explore -> Otomatis isi "@all" & trigger search
        exploreBtn.addEventListener('click', () => {
            searchBox.value = '@all';
            handleSearch('@all');
            searchDropdown.classList.remove('active');
        });

        // Klik item di dalam dropdown rekomendasi
        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', () => {
                const val = item.getAttribute('data-query');
                searchBox.value = val;
                handleSearch(val);
            });
        });

        // Tutup dropdown kalau klik di luar area search box
        window.addEventListener('click', (e) => {
            if (!searchBox.contains(e.target) && !searchDropdown.contains(e.target)) {
                searchDropdown.classList.remove('active');
            }
        });

        // Floating Menu & Theme Toggle
        const floatBubble = document.getElementById('floatBubble');
        const floatMenu = document.getElementById('floatMenu');
        floatBubble.addEventListener('click', () => floatMenu.classList.toggle('active'));

        document.getElementById('btnBackToTop').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            floatMenu.classList.remove('active');
        });

        document.getElementById('btnSwitchTheme').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', current);
            localStorage.setItem('abdullah_theme', current);
            floatMenu.classList.remove('active');
        });

        const saved = localStorage.getItem('abdullah_theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);


// Generate Hot Topics otomatis dari data articles yang ber-badge 'hot'
const dynamicHotList = document.getElementById('dynamicHotList');
if (typeof articles !== 'undefined') {
   // SEBELUMNYA: const hotArticles = articles.filter(item => item.badge === 'hot');
    const hotArticles = articles.filter(item => item.badge === 'hot').slice(0, 2);
                                                       			//SLICE 0,2: berarti maksimal hot item yg di munculin cuma 2 yg dinamis.

    hotArticles.forEach(item => {
        const div = document.div || document.createElement('div'); // fallback aman
        const itemDiv = document.createElement('div');
        itemDiv.className = 'dropdown-item';
        itemDiv.setAttribute('data-query', item.title);
        itemDiv.innerHTML = `↪ ${item.title}`;
        
        // Event klik buat langsung nge-search judul tersebut
        itemDiv.addEventListener('click', () => {
            searchBox.value = item.title;
            handleSearch(item.title);
        });
        
        dynamicHotList.appendChild(itemDiv);
    });
}

searchBox.addEventListener('focus', () => {
    // Ambil posisi kotak search di layar secara akurat
    const rect = searchBox.getBoundingClientRect();
    searchDropdown.style.top = (rect.bottom + window.scrollY + 6) + 'px';
    searchDropdown.style.left = (rect.left + window.scrollX) + 'px';
    searchDropdown.style.width = rect.width + 'px';
    
    searchDropdown.classList.add('active');
});


// TAG FILTER

// Logika Filter Berdasarkan Kategori Chip
// Pastikan variabel chips dipanggil setelah dokumen siap
const chips = document.querySelectorAll('.chip');

chips.forEach(chip => {
    chip.addEventListener('click', () => {
        // 1. Bersihkan semua kelas active
        chips.forEach(c => c.classList.remove('active'));
        // 2. Tandai chip yang sedang ditekan
        chip.classList.add('active');

        const selectedTag = chip.getAttribute('data-cat');
        wrapper.classList.add('searched');

        if (selectedTag === 'all') {
            renderArticles(articles);
        } else {
            // 3. Filter aman dengan pengecekan array tags
            const filtered = articles.filter(item => 
                item.tags && item.tags.includes(selectedTag)
            );
            renderArticles(filtered);
        }
    });
});

    </script>
</body>
