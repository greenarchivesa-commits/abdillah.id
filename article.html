<style>
/* Cara Mematikan Highlighting (Selection) Global, Kecuali Isi Artikel
Biar pas orang buka pake HP gak sengaja nge-highlight teks tampilan menu/tombol yang malah bikin risih, kita bisa matikan fitur text selection lewat CSS secara global, tapi kita hidupkan khusus untuk area teks artikel (.article-body).

Tambahkan kode CSS ini di bagian paling atas atau bawah file style.css:

CSS */

/* Matikan seleksi teks untuk SELURUH HALAMAN secara default */
* {
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none;    /* IE 10+ */
    user-select: none;        /* Standard */
}

/* KECUALI bagian isi artikel, tetap bisa di-highlight / di-copy */
.article-body, 
.article-body * {
    -webkit-user-select: text;
    -ms-user-select: text;
    user-select: text;
}
</style>

    <script src="script.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        const artTitle = document.getElementById('artTitle');
        const artDate = document.getElementById('artDate');
        const artBody = document.getElementById('artBody');
        const tocList = document.getElementById('tocList');
        const recContainer = document.getElementById('recContainer');
        
        const jumpOverlay = document.getElementById('jumpOverlay');
        const jumpOverlayList = document.getElementById('jumpOverlayList');
        const jumpCloseBtn = document.getElementById('jumpCloseBtn');
        const btnTocMobile = document.getElementById('btnTocMobile');

        if (fileName) {
            const script = document.createElement('script');
            script.src = `articles/${fileName}.js`;

            script.onload = () => {
                if (window.currentArticleData) {
                    const current = window.currentArticleData;
                    artTitle.textContent = current.title;
                    artDate.textContent = current.date;
                    artBody.innerHTML = current.content;
                    document.title = `${current.title} - abdullah.com`;

                    // Generate Table of Contents (Desktop & Overlay Mobile)
                    const headings = artBody.querySelectorAll('h2');
                    headings.forEach(h => {
                        if (!h.id) {
                            h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                        }
                        
                        // Panel Kanan Desktop
                        const liDesktop = document.createElement('li');
                        liDesktop.innerHTML = `<a href="#${h.id}">${h.textContent}</a>`;
                        tocList.appendChild(liDesktop);

                        // Menu Overlay Fullscreen
                        const liOverlay = document.createElement('li');
                        liOverlay.innerHTML = `<a href="#${h.id}" class="overlay-link">${h.textContent}</a>`;
                        jumpOverlayList.appendChild(liOverlay);
                    });

                    // Klik link di overlay otomatis nutup overlay dan scroll halus
                    document.querySelectorAll('.overlay-link').forEach(link => {
                        link.addEventListener('click', () => {
                            jumpOverlay.classList.remove('active');
                        });
                    });
                }
            };

            script.onerror = () => {
                artTitle.textContent = "Artikel Tidak Ditemukan";
                artBody.innerHTML = "<p>File artikel tidak tersedia.</p>";
            };

            document.body.appendChild(script);
        }

        // 2. TULISAN LAINNYA: ACAK (RANDOM) DINAMIS SETIAP REFRESH
        if (typeof articles !== 'undefined') {
            // Saring artikel selain yang sedang dibuka
            let otherArticles = articles.filter(item => item.file !== fileName);
            
            // Algoritma Randomize Array (Fisher-Yates Shuffle)
            otherArticles.sort(() => Math.random() - 0.5);

            // Ambil maksimal 2 artikel acak teratas buat rekomendasi
            let randomized = otherArticles.slice(0, 2);

            randomized.forEach(item => {
                const card = document.createElement('a');
                card.href = `article.html?file=${item.file}`;
                card.className = 'rec-card';
                card.innerHTML = `
                    <div class="rec-card-title">${item.title}</div>
                    <div class="rec-card-date">${item.date}</div>
                `;
                recContainer.appendChild(card);
            });
        }

        // 3. KONTROL INTERAKSI & MOBILE RESPONSIVE
        const floatBubble = document.getElementById('floatBubble');
        const floatMenu = document.getElementById('floatMenu');
        
        floatBubble.addEventListener('click', () => floatMenu.classList.toggle('active'));
        
        window.addEventListener('click', (e) => {
            if (!floatBubble.contains(e.target) && !floatMenu.contains(e.target)) {
                floatMenu.classList.remove('active');
            }
        });

        document.getElementById('btnBackToTop').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            floatMenu.classList.remove('active');
        });

        // Buka Fullscreen Overlay Jump To
        btnTocMobile.addEventListener('click', () => {
            floatMenu.classList.remove('active');
            jumpOverlay.classList.add('active');
        });

        // Tutup Fullscreen Overlay
        jumpCloseBtn.addEventListener('click', () => {
            jumpOverlay.classList.remove('active');
        });

        // Toggle Theme & LocalStorage
        document.getElementById('btnSwitchTheme').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', current);
            localStorage.setItem('abdullah_theme', current);
            floatMenu.classList.remove('active');
        });

        const saved = localStorage.getItem('abdullah_theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);



const noteBox = document.getElementById('editableNote');

// 1. Ambil catatan yang tersimpan sebelumnya saat halaman dibuka
const savedNote = localStorage.getItem('abdullah_side_note');
if (savedNote) {
    noteBox.innerHTML = savedNote;
}

// 2. Auto-save otomatis setiap kali lu ngetik (event 'input')
noteBox.addEventListener('input', () => {
    localStorage.setItem('abdullah_side_note', noteBox.innerHTML);
});

    </script>
